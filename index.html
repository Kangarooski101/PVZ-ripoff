<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineVault — Watch Movies & Play Games</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a href="#" class="logo">Cine<span>Vault</span></a>
    <nav class="nav-tabs">
      <button class="nav-btn active" data-tab="movies">Movies</button>
      <button class="nav-btn" data-tab="games">Arcade (50+ Games)</button>
      <button class="nav-btn" data-tab="watchlist">My List (<span id="watchlistCount">0</span>)</button>
    </nav>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movies & games..." />
    </div>
  </header>

  <section class="hero" id="heroSection">
    <div class="hero-content">
      <span class="badge" id="heroBadge">Featured Premiere</span>
      <h1 id="heroTitle">The Last Horizon</h1>
      <p id="heroDesc">When a deep-space relay goes silent, an estranged crew must navigate an uncharted nebula to save Earth's final colony ship.</p>
      <div class="hero-actions">
        <button class="btn btn-play" id="heroWatchBtn">&#9654; Watch Now</button>
        <button class="btn btn-secondary" id="featuredBtn">View Details</button>
      </div>
    </div>
  </section>

  <main>
    <div class="section-header">
      <h2 id="sectionTitle">Stream Movies</h2>
      <span class="item-count" id="itemCount"></span>
    </div>
    <div class="filters" id="genreFilters"></div>
    <div class="grid" id="movieGrid"></div>
  </main>

  <!-- Details & Watch/Play Modal -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modalContainer">
      <button class="close-btn" id="closeModalBtn">&times;</button>
      
      <!-- Details View -->
      <div class="modal-details-view" id="modalDetailsView">
        <img id="modalPoster" src="" alt="Cover Art" />
        <div class="modal-info">
          <span class="badge" id="modalTypeBadge">Movie</span>
          <h2 id="modalTitle"></h2>
          <div class="modal-sub" id="modalMeta"></div>
          <p class="modal-desc" id="modalDesc"></p>
          <div class="modal-actions">
            <button class="btn btn-play" id="watchNowBtn">&#9654; Watch Now</button>
            <button class="btn btn-secondary" id="watchlistBtn">+ Add to My List</button>
          </div>
        </div>
      </div>

      <!-- Interactive Player / Game Canvas View -->
      <div class="modal-player-view" id="modalPlayerView" style="display: none;">
        <div class="player-header">
          <button class="btn btn-secondary btn-sm" id="backToDetailsBtn">&larr; Back to Details</button>
          <h3 id="playerTitle">Now Playing</h3>
          <button class="btn btn-secondary btn-sm" id="fullscreenBtn">&#x26F6; Fullscreen</button>
        </div>
        <div class="player-wrapper" id="playerWrapper">
          <!-- Video player or Playable HTML5 Game injects here -->
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

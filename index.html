<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cows vs. Aliens: Galactic Herd</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header id="hud">
            <div class="stat-box">🥛 Milk: <span id="milk-count">150</span></div>
            <div class="stat-box">🌍 Biome: <span id="biome-name">Green Pasture</span></div>
            <div class="stat-box">🌊 Wave: <span id="wave-count">1</span>/<span id="max-waves">3</span></div>
            <div class="stat-box">❤️ Barn HP: <span id="barn-hp">5</span></div>
            <div class="stat-box hint">🪏 Hover Cow + Press [S] to Refund 50%</div>
        </header>

        <div id="shop-bar"></div>

        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="1100" height="500"></canvas>
            <div id="overlay" class="hidden">
                <h1 id="overlay-title">Biome Overrun!</h1>
                <p id="overlay-sub">The aliens breached your barn!</p>
                <button id="restart-btn">Retry Current Biome</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

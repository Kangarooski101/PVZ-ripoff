<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineVault — Movie Discovery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a href="#" class="logo">Cine<span>Vault</span></a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movies..." />
    </div>
  </header>

  <section class="hero">
    <div class="hero-content">
      <span class="badge">Featured Premiere</span>
      <h1>The Last Horizon</h1>
      <p>When a deep-space relay goes silent, an estranged crew must navigate an uncharted nebula to save Earth's final colony ship.</p>
      <button class="btn" id="featuredBtn">View Details</button>
    </div>
  </section>

  <main>
    <div class="filters" id="genreFilters"></div>
    <div class="grid" id="movieGrid"></div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <button class="close-btn" id="closeModalBtn">&times;</button>
      <img id="modalPoster" src="" alt="Movie Poster" />
      <div class="modal-info">
        <h2 id="modalTitle"></h2>
        <div class="modal-sub" id="modalMeta"></div>
        <p class="modal-desc" id="modalDesc"></p>
        <button class="btn" id="watchlistBtn">+ Add to Watchlist</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
